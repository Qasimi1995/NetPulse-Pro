ShortDescription: "Obsidian-dark real-time Windows network telemetry and bandwidth monitor featuring a 220 degree dual-arc speedometer gauge, live traffic graph, non-destructive cycle resets and system tray integration."
Description: |
  NetPulse Pro is a standalone Windows desktop application that visualises live
  network throughput with a hand-drawn 220 degree dual-arc speedometer gauge,
  tracks monitored and per-cycle bandwidth, supports range analytics with CSV
  export, and stays out of the way in the system tray.
